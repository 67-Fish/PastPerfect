version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pastperfect-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=http://localhost:3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=pastperfect
      - DB_PASSWORD=changeme
      - DB_NAME=pastperfect
      - JWT_ACCESS_SECRET=your-super-secret-access-key-change-in-production-min-32-chars
      - JWT_REFRESH_SECRET=your-super-secret-refresh-key-change-in-production-min-32-chars
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pastperfect-network

  mysql:
    image: mysql:8.0
    container_name: pastperfect-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=pastperfect
      - MYSQL_USER=pastperfect
      - MYSQL_PASSWORD=changeme
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pastperfect-network

volumes:
  mysql_data:

networks:
  pastperfect-network:
    driver: bridge